{% macro barra(ruta, q, etiqueta, filtros, fecha=none) %}
<form method="GET" action="{{ url_for(ruta) }}" class="admin-filtros row g-3 align-items-end mb-4">
    <div class="col-12 col-lg">
        <label for="busqueda-admin" class="form-label">{{ etiqueta }}</label>
        <input id="busqueda-admin" type="search" name="q" value="{{ q }}" class="form-control" placeholder="{{ etiqueta }}...">
    </div>
    {% for nombre, titulo, seleccionado, opciones in filtros %}
    <div class="col-12 col-sm-6 col-lg">
        <label for="filtro-{{ nombre }}" class="form-label">{{ titulo }}</label>
        <select id="filtro-{{ nombre }}" name="{{ nombre }}" class="form-select">
            {% for valor, texto in opciones %}
            <option value="{{ valor }}" {% if seleccionado == valor %}selected{% endif %}>{{ texto }}</option>
            {% endfor %}
        </select>
    </div>
    {% endfor %}
    {% if fecha is not none %}
    <div class="col-12 col-sm-6 col-lg">
        <label for="filtro-fecha" class="form-label">Fecha de solicitud</label>
        <input type="date" id="filtro-fecha" name="fecha" value="{{ fecha }}" class="form-control">
    </div>
    {% endif %}
    <div class="col-12 d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-search me-2" aria-hidden="true"></i>Buscar</button>
        <a href="{{ url_for(ruta) }}" class="btn btn-outline-secondary">Limpiar</a>
    </div>
</form>
{% endmacro %}
