<form method="GET" class="row g-2 mb-4" role="search">
    <div class="col-12 col-sm">
        <label for="busqueda" class="visually-hidden">{{ etiqueta_busqueda }}</label>
        <input id="busqueda" type="search" name="q" value="{{ q }}" class="form-control" placeholder="{{ etiqueta_busqueda }}...">
    </div>
    <div class="col-auto"><button type="submit" class="btn btn-primary">Buscar</button></div>
    <div class="col-auto"><a href="{{ url_for(ruta_busqueda) }}" class="btn btn-outline-secondary">Limpiar</a></div>
</form>
